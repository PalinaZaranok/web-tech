<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link href="\public\view\css\autoStyle.css" rel="stylesheet">
</head>
<body>
<div class="auth-container">
    <div class="auth-header">
        <h1 class="auth-title">Добро пожаловать</h1>
        <p>Пожалуйста, войдите в свой аккаунт</p>
    </div>

    <form id="loginForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
            <label class="input-label" for="email">Email</label>
            <input
                    type="email"
                    id="email"
                    class="input-field"
                    placeholder="example@mail.com"
                    required
            >
        </div>

        <div class="form-group">
            <label class="input-label" for="password">Пароль</label>
            <input
                    type="password"
                    id="password"
                    class="input-field"
                    placeholder="••••••••"
                    required
            >
        </div>

        <button type="submit" class="submit-btn">Войти</button>
        <button type="submit" class="submit-btn" id="logout-btn">Выйти</button>
        <div class="remember-me">
            <input type="checkbox" id="rememberMe" name="rememberMe">
            <label for="rememberMe">Запомнить меня</label>
        </div>
    </form>

    <div class="auth-footer">
        Нет аккаунта?
        <a href="/registration" class="auth-link">Зарегистрироваться</a>
    </div>
</div>

<script src="\public\view\js\auto.js"></script>
</body>
</html>
