<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="\public\view\css\autoStyle.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-header">
        <h1 class="auth-title">Создать аккаунт</h1>
    </div>

    <form id="registrationForm" onsubmit="handleRegistration(event)">
        <div class="form-group">
            <label class="input-label" for="username">Имя пользователя</label>
            <input type="text"
                   class="input-field"
                   id="username"
                   name="username"
                   required
                   placeholder="Введите ваше имя">
        </div>

        <div class="form-group">
            <label class="input-label" for="email">Электронная почта</label>
            <input type="email"
                   class="input-field"
                   id="email"
                   name="email"
                   required
                   placeholder="example@mail.com">
        </div>

        <div class="form-group">
            <label class="input-label" for="password">Пароль</label>
            <input type="password"
                   class="input-field"
                   id="password"
                   name="password"
                   required
                   placeholder="Не менее 8 символов">
        </div>

        <div class="form-group">
            <label class="input-label" for="confirmPassword">Подтвердите пароль</label>
            <input type="password"
                   class="input-field"
                   id="confirmPassword"
                   name="confirmPassword"
                   required
                   placeholder="Повторите ваш пароль">
        </div>

        <button type="submit" class="submit-btn">Зарегистрироваться</button>
    </form>

    <div class="auth-footer">
        Уже есть аккаунт?
        <a href="/authorization" class="auth-link">Войти</a>
    </div>

</div>

<script src="\public\view\js\registration.js"></script>
</body>
</html>
